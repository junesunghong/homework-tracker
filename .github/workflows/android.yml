name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # 앱에 내장되는 파이썬과 같은 버전으로 테스트

      - name: 서버 테스트
        working-directory: server
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비 (Secrets 에 HW_KEYSTORE_B64 가 있을 때)
        env:
          KS_B64: ${{ secrets.HW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/homework.jks"
            echo "HW_KS_FILE=$RUNNER_TEMP/homework.jks" >> "$GITHUB_ENV"
            echo "서명 키 사용"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::릴리스(태그)는 서명 키가 있어야 합니다. 키가 바뀌면 설치된 앱이 업데이트되지 않습니다. README 「서명 키」 참고."
            exit 1
          else
            echo "::warning::HW_KEYSTORE_B64 가 없어 디버그 키로 서명합니다. 시험 설치만 하고, 업데이트는 이어지지 않습니다."
          fi

      - name: APK 빌드
        env:
          HW_KS_PASS: ${{ secrets.HW_KS_PASS }}
          HW_KEY_PASS: ${{ secrets.HW_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK 점검 (설치 실패 원인을 배포 전에 거른다)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "== 서명 (v1/v2 가 유효해야 설치된다)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
          echo "== 매니페스트"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code|application-label:" | tee badging.txt
          grep -q "sdkVersion:'24'" badging.txt || { echo "::error::minSdk 가 24(안드로이드 7)가 아닙니다"; exit 1; }
          grep -q "arm64-v8a" badging.txt && grep -q "armeabi-v7a" badging.txt || { echo "::error::arm64-v8a·armeabi-v7a 가 모두 들어 있어야 합니다"; exit 1; }
          grep -q "testOnly" badging.txt && { echo "::error::testOnly APK 는 일반 설치가 안 됩니다"; exit 1; } || true
          echo "== 내장 파일"
          unzip -l "$APK" | awk '{print $4}' | grep -E "^assets/web/|^assets/chaquopy/[^/]+$" | sort
          unzip -l "$APK" "assets/web/index.html" "assets/web/app.js" > /dev/null || { echo "::error::화면 파일(assets/web) 이 없습니다"; exit 1; }
          unzip -p "$APK" assets/chaquopy/app.imy > app.imy && unzip -l app.imy | grep -q "server.py" || { echo "::error::server.py 가 앱에 없습니다"; exit 1; }
          ls -la "$APK"

      - name: 산출물 정리 (APK · version.json · PC 서버 zip)
        run: |
          VER=$(python -c "import re;print(re.search(r'APP_VERSION = \"([0-9.]+)\"', open('server/server.py', encoding='utf-8').read()).group(1))")
          CODE=$(python -c "a,b,c='$VER'.split('.');print(int(a)*10000+int(b)*100+int(c))")
          mkdir -p out pkg/homework-tracker-server/apk
          cp app/build/outputs/apk/release/app-release.apk "out/homework-tracker-v$VER.apk"
          # PC 서버 zip: 서버 + 앱 업데이트 폴더(apk/) — PC 를 서버로 쓸 때 다른 기기에 앱을 나눠 준다
          cp -r server/server.py server/static server/run.sh server/run.bat pkg/homework-tracker-server/
          cp app/build/outputs/apk/release/app-release.apk pkg/homework-tracker-server/apk/homework-tracker.apk
          printf '{"versionCode": %s, "versionName": "%s"}\n' "$CODE" "$VER" > pkg/homework-tracker-server/apk/version.json
          cp pkg/homework-tracker-server/apk/version.json out/version.json
          # 받는 사람용 설치 안내 (메모장에서 한글이 깨지지 않게 UTF-8 BOM)
          python - "$VER" <<'PY'
          import sys
          ver = "v" + sys.argv[1]
          text = open("deploy/설치안내.txt", encoding="utf-8").read().replace("{버전}", ver)
          for path in (f"out/숙제체크-설치안내-{ver}.txt", "pkg/homework-tracker-server/설치안내.txt"):
              open(path, "w", encoding="utf-8-sig", newline="\r\n").write(text)
          PY
          (cd pkg && zip -qr "../out/homework-tracker-server-v$VER.zip" homework-tracker-server)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: homework-tracker
          path: out/*

      - name: 태그면 릴리스에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
